version: '3.8'

services:
  mongo:
    image: docker.m.daocloud.io/library/mongo:7
    container_name: api_debugger_mongo
    restart: unless-stopped
    ports:
      - "2906:27017"
    environment:
      MONGO_INITDB_DATABASE: api_debugger
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - api_debugger_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api_debugger_backend
    restart: unless-stopped
    ports:
      - "3106:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/api_debugger
      - JWT_SECRET=${JWT_SECRET:-api-debugger-secret-key-change-this}
      - JWT_EXPIRES_IN=7d
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - api_debugger_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: api_debugger_frontend
    restart: unless-stopped
    ports:
      - "8106:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/share/nginx/html/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - api_debugger_network

volumes:
  mongo_data:
    name: api_debugger_mongo_data

networks:
  api_debugger_network:
    name: api_debugger_network
    driver: bridge
